<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1460" viewBox="0 0 1000 1460" role="img" aria-labelledby="title desc">
  <title id="title">DV38 APK runtime workflow</title>
  <desc id="desc">Flowchart showing install, startup, domain selection, WebView, JavaScript bridge, downloads, Telegram sharing and referral loop.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0e1428"/>
    </linearGradient>
    <style>
      .box   { fill: #141c33; stroke: #3b82f6; stroke-width: 2; rx: 14; }
      .box2  { fill: #1a1433; stroke: #a855f7; stroke-width: 2; rx: 14; }
      .box3  { fill: #10261f; stroke: #22c55e; stroke-width: 2; rx: 14; }
      .box4  { fill: #2a1320; stroke: #ef4444; stroke-width: 2; rx: 14; }
      .title { fill: #e8eefc; font-size: 17px; font-weight: 700; }
      .small { fill: #a9b8d8; font-size: 13px; }
      .h1    { fill: #f8fafc; font-size: 34px; font-weight: 800; }
      .h2    { fill: #8fa3c8; font-size: 15px; }
      .note  { fill: #64748b; font-size: 12px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      text  { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="1460" fill="url(#bg)"/>

  <text x="500" y="52" text-anchor="middle" class="h1">DV38 APK — Runtime Workflow</text>
  <text x="500" y="82" text-anchor="middle" class="h2">White-label gambling WebView shell • package prod.app_dv38usdf1.com • v2.4.69</text>

  <!-- 1 -->
  <rect x="140" y="120" width="720" height="70" class="box"/>
  <text x="500" y="150" text-anchor="middle" class="title">1. Sideload / install</text>
  <text x="500" y="173" text-anchor="middle" class="small">unknown-source APK received through Telegram or a download page</text>

  <!-- 2 -->
  <rect x="140" y="230" width="720" height="70" class="box"/>
  <text x="500" y="260" text-anchor="middle" class="title">2. X5_Activity — launcher, exported</text>
  <text x="500" y="283" text-anchor="middle" class="small">starts AppTestApp immediately</text>

  <!-- 3 -->
  <rect x="140" y="340" width="720" height="100" class="box"/>
  <text x="500" y="368" text-anchor="middle" class="title">3. AppTestApp.onCreate()</text>
  <text x="500" y="392" text-anchor="middle" class="small">reads manifest metadata: merchant = dv38usdf1 • merchant_url = 12249046.com, dv38.info, …</text>
  <text x="500" y="412" text-anchor="middle" class="small">initializes Firebase, AppsFlyer, Adjust, Facebook, OpenInstall</text>
  <text x="500" y="432" text-anchor="middle" class="small">device UUID from Android ID / Build fields → device_stats.xml</text>

  <!-- 4 -->
  <rect x="140" y="470" width="720" height="90" class="box"/>
  <text x="500" y="498" text-anchor="middle" class="title">4. Domain selection (L4.c / L4.f)</text>
  <text x="500" y="522" text-anchor="middle" class="small">reuse cached domainRoute, or speed-test the last URL / up to 20 domains</text>
  <text x="500" y="542" text-anchor="middle" class="small">picks the fastest reachable domain</text>

  <!-- 5 -->
  <rect x="140" y="590" width="720" height="100" class="box"/>
  <text x="500" y="618" text-anchor="middle" class="title">5. WebView loads remote site</text>
  <text x="500" y="642" text-anchor="middle" class="small">https://FAST-DOMAIN/m/index.html?affiliateCode=…&amp;gaid=…&amp;fbPixelId=…&amp;tid=…</text>
  <text x="500" y="662" text-anchor="middle" class="small">F4.H: JavaScript + file access • mixed content allowed • SSL errors ignored</text>
  <text x="500" y="682" text-anchor="middle" class="small">any http* navigation stays inside the same privileged WebView</text>

  <!-- 6 -->
  <rect x="140" y="720" width="720" height="70" class="box2"/>
  <text x="500" y="750" text-anchor="middle" class="title">6. Remote DV38 website</text>
  <text x="500" y="773" text-anchor="middle" class="small">actual gambling / betting content is server-side and can change at any time</text>

  <!-- 7 -->
  <rect x="60" y="830" width="420" height="170" class="box3"/>
  <text x="270" y="858" text-anchor="middle" class="title">JS bridge — window.Android</text>
  <text x="88" y="886" class="small">• openAndroid(intent URI)</text>
  <text x="88" y="908" class="small">• oauthLogin / facebookLogin</text>
  <text x="88" y="930" class="small">• nativeShare(title, text)</text>
  <text x="88" y="952" class="small">• storageGet / storageSet</text>
  <text x="88" y="974" class="small">• eventTracker / FCM token</text>

  <!-- 8 -->
  <rect x="520" y="830" width="420" height="170" class="box4"/>
  <text x="730" y="858" text-anchor="middle" class="title">DownloadListener</text>
  <text x="548" y="886" class="small">• images → gallery</text>
  <text x="548" y="908" class="small">• other files → Downloads/GenericFiles</text>
  <text x="548" y="930" class="small">• .apk → update.apk → install intent</text>
  <text x="548" y="952" class="small">• FileProvider exposes external storage</text>

  <!-- 9 -->
  <rect x="60" y="1050" width="420" height="150" class="box3"/>
  <text x="270" y="1078" text-anchor="middle" class="title">Share sheet → Telegram</text>
  <text x="88" y="1104" class="small">• nativeShare sends text only</text>
  <text x="88" y="1126" class="small">• user selects Telegram</text>
  <text x="88" y="1148" class="small">• APK URL becomes a link preview</text>
  <text x="88" y="1170" class="small">• user still presses Send</text>

  <!-- 10 -->
  <rect x="520" y="1050" width="420" height="150" class="box4"/>
  <text x="730" y="1078" text-anchor="middle" class="title">Install attempt</text>
  <text x="548" y="1104" class="small">• .apk saved as update.apk</text>
  <text x="548" y="1126" class="small">• ACTION_INSTALL_PACKAGE via FileProvider</text>
  <text x="548" y="1148" class="small">• no REQUEST_INSTALL_PACKAGES</text>
  <text x="548" y="1170" class="small">• normally blocked on Android 8+</text>

  <!-- 11 -->
  <rect x="140" y="1250" width="720" height="95" class="box2"/>
  <text x="500" y="1280" text-anchor="middle" class="title">Referral loop</text>
  <text x="500" y="1306" text-anchor="middle" class="small">new install → affiliateCode + GAID → register event → inviter credit / bonus</text>

  <!-- arrows -->
  <path d="M500 190 V230" class="arrow"/>
  <path d="M500 300 V340" class="arrow"/>
  <path d="M500 440 V470" class="arrow"/>
  <path d="M500 560 V590" class="arrow"/>
  <path d="M500 690 V720" class="arrow"/>
  <path d="M500 790 V810 H270 V830" class="arrow"/>
  <path d="M500 790 V810 H730 V830" class="arrow"/>
  <path d="M270 1000 V1050" class="arrow"/>
  <path d="M730 1000 V1050" class="arrow"/>
  <path d="M270 1200 V1225 H500 V1250" class="arrow"/>
  <path d="M730 1200 V1225 H500 V1250" class="arrow"/>

  <text x="500" y="1390" text-anchor="middle" class="note">Static analysis • defensive research only • do not install or redistribute the sample</text>
  <text x="500" y="1412" text-anchor="middle" class="note">SHA-256 63bf80f8e92c61fada10f4bd7acf0cc294a87a9c6af015e445a2c0a477bfc668</text>
</svg>
